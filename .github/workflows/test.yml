name: Tests

on:
  # AUD-A18-CIPRODBRANCH: `prod` is the branch that actually deploys (CLAUDE.md's deploy pattern
  # is commit to prod -> push -> git pull on EC2), and it was 607 commits ahead of main when this
  # was found — so before this line existed, NO deployed commit had ever had `make test` run
  # against it by CI. Tier 383 repaired `make test` so it CAN fail; without prod here, that
  # repair reached nobody.
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # AUD-A18: was "3.11" while every service Dockerfile is python:3.12-slim and
          # production runs 3.12.14 — so CI was testing against a Python this project uses
          # NOWHERE. The first CI run on prod failed with "f-string expression part cannot
          # include a backslash" in email_service.py:2254: valid 3.12 (PEP 701), a
          # SyntaxError in 3.11. CI must track the deployed runtime, not lag it.
          python-version: "3.12"
          cache: pip

      - name: Install per-service dependencies
        run: |
          for svc in \
            market-data \
            technical-analysis \
            ml-prediction \
            ranking-engine \
            signal-engine \
            strategy-engine \
            portfolio-optimizer \
            research-engine \
            decision-engine \
            event-intelligence \
            news-intelligence; do
            echo "── installing $svc ──"
            pip install -q -r services/$svc/requirements.txt
          done
          pip install -q pytest pytest-asyncio

      - name: Run unit tests
        run: make test

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: "**/.pytest_cache"
          retention-days: 7

  outbox-concurrency:
    name: Outbox concurrency (PostgreSQL)
    runs-on: ubuntu-latest

    # REQUIRED, NOT OPTIONAL. The outbox's claim protocol is a compare-and-set under
    # contention, and SQLite serialises writers — so the SQLite suite structurally cannot
    # exercise simultaneous claims, racing settles, or transaction conflicts. Skipping locally
    # is fine; a release must not pass without these having run. OUTBOX_PG_REQUIRED turns the
    # skip into a failure, so a misconfigured service container cannot make this job pass green
    # while testing nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: outboxprobe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -q -r services/market-data/requirements.txt
          pip install -q pytest psycopg2-binary

      - name: Outbox concurrency and crash recovery
        env:
          OUTBOX_PG_URL: postgresql+psycopg2://postgres:probe@localhost:5432/outboxprobe
          OUTBOX_PG_REQUIRED: "1"
        run: |
          cd services/market-data
          python -m pytest tests/test_outbox_postgres_concurrency.py -q

  typecheck:
    name: Frontend typecheck + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: TypeScript check
        run: npm run --prefix frontend typecheck 2>/dev/null || npx --prefix frontend tsc --noEmit

      - name: Frontend unit tests
        run: npm test --prefix frontend
