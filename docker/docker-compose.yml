name: stockai

# AUD-LOGROTATE: no logging driver was ever configured on any service — every container used
# Docker's default json-file driver with NO size cap and NO rotation, so container logs grew
# unbounded for as long as a container stayed up. Confirmed live: market-data's own log file
# alone had grown to 1.9GB (the busiest container — 66 scheduled jobs, 5-min-cadence
# refreshes), ml-prediction 929MB, news-intelligence 417MB (1-2 min RSS/EDGAR polling) — three
# containers alone accounted for ~3.2GB of the ~54GB that had accumulated platform-wide by
# 2026-09-04 (28GB dangling images + 22.8GB stale BuildKit cache + these unbounded logs).
# max-size=20m/max-file=5 caps any one container's log footprint at 100MB total (5 rotated
# 20MB files) — generous enough to keep a real multi-day debugging window via `docker logs`,
# but bounded instead of growing forever.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-py-common: &py-common
  env_file: ../.env
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  networks: [stockai-net]
  restart: unless-stopped
  logging: *default-logging

services:
  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    networks: [stockai-net]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockai -d stockai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    #ports: ["6379:6379"]
    networks: [stockai-net]
    volumes:
      - redisdata:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  market-data:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/market-data/Dockerfile
    #ports: ["8001:8001"]
    volumes:
      - datavol:/data

  technical-analysis:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/technical-analysis/Dockerfile
    #ports: ["8002:8002"]

  ml-prediction:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/ml-prediction/Dockerfile
    #ports: ["8003:8003"]
    volumes:
      - datavol:/data
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "1.5"

  ranking-engine:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/ranking-engine/Dockerfile
    #ports: ["8004:8004"]

  signal-engine:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/signal-engine/Dockerfile
    #ports: ["8005:8005"]
    volumes:
      - datavol:/data

  strategy-engine:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/strategy-engine/Dockerfile
    #ports: ["8006:8006"]

  portfolio-optimizer:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/portfolio-optimizer/Dockerfile
    #ports: ["8007:8007"]

  research-engine:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/research-engine/Dockerfile
    #ports: ["8008:8008"]

  decision-engine:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/decision-engine/Dockerfile
    #ports: ["8009:8009"]

  event-intelligence:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/event-intelligence/Dockerfile
    #ports: ["8010:8010"]

  news-intelligence:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/news-intelligence/Dockerfile
    #ports: ["8011:8011"]

  api-gateway:
    <<: *py-common
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      market-data:
        condition: service_healthy
      technical-analysis:
        condition: service_healthy
      ml-prediction:
        condition: service_healthy
      ranking-engine:
        condition: service_healthy
      signal-engine:
        condition: service_healthy
      strategy-engine:
        condition: service_healthy
      portfolio-optimizer:
        condition: service_healthy
      research-engine:
        condition: service_healthy
      decision-engine:
        condition: service_healthy
      event-intelligence:
        condition: service_healthy
      news-intelligence:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    env_file: ../.env
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api-gateway]
    networks: [stockai-net]
    restart: unless-stopped
    logging: *default-logging

volumes:
  datavol:
  pgdata:
  redisdata:

networks:
  stockai-net:
    driver: bridge
