<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111a33"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- three bold bars, ascending -->
  <rect x="120" y="270" width="70" height="140" rx="18" fill="url(#bar)" opacity="0.6"/>
  <rect x="221" y="195" width="70" height="215" rx="18" fill="url(#bar)" opacity="0.8"/>
  <rect x="322" y="120" width="70" height="290" rx="18" fill="url(#bar)"/>

  <!-- single bold ascending signal line -->
  <path d="M 108 380 L 357 120" fill="none" stroke="url(#line)" stroke-width="34" stroke-linecap="round"/>
  <circle cx="357" cy="120" r="40" fill="#a3e635"/>
</svg>
